.nav-inner{display:flex;align-items:center;gap:48px;width:100%;max-width:1600px;padding:0 28px} .brand{display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:.08em;font-size:11px;text-transform:uppercase;color:var(--gold)} .brand b{font-size:22px} .links{display:flex;gap:30px} .links a{color:var(--porcelain);text-decoration:none;font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;opacity:.72;position:relative;transition:.25s} .links a::after{content:'';position:absolute;left:0;bottom:-6px;width:0;height:1px;background:var(--gold);transition:.4s cubic-bezier(.16,1,.3,1)} .links a:hover{opacity:1;transform:translateY(-1px)} .links a:hover::after,.links a.active::after{width:100%} .links a.active{opacity:1;color:var(--gold)}

.footer{border-top:1px solid var(--line);padding:48px clamp(1.5rem,5vw,5rem);display:grid;grid-template-columns:1.2fr .8fr .8fr;gap:24px;background:rgba(10,20,40,.6);position:relative;z-index:3} @media(max-width:900px){.footer{grid-template-columns:1fr} .stat-strip{grid-template-columns:1fr}}
.reveal{opacity:0;transform:translateY(24px) scale(.98);filter:blur(10px);transition:transform 1s cubic-bezier(.16,1,.3,1), opacity .8s, filter 1s} .reveal.in{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}

<script type="module">
import gsap from 'gsap';
const lenis={y:0, vy:0, ty:0}; function loop(){ lenis.ty=window.scrollY; lenis.vy+=(lenis.ty-lenis.y)*0.105; lenis.vy*=0.82; lenis.y+=lenis.vy; requestAnimationFrame(loop);} loop();
const canvas=document.getElementById('ripple'); const ctx=canvas.getContext('2d'); function resize(){canvas.width=innerWidth*devicePixelRatio;canvas.height=innerHeight*devicePixelRatio;canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';ctx.scale(devicePixelRatio,devicePixelRatio);} resize(); window.addEventListener('resize',resize);
let ripples=[]; let mouse={x:innerWidth/2,y:innerHeight/2,tx:innerWidth/2,ty:innerHeight/2}; window.addEventListener('mousemove',e=>{mouse.tx=e.clientX;mouse.ty=e.clientY; if(Math.random()<0.22) ripples.push({x:e.clientX,y:e.clientY,r:0,rmax:420+Math.random()*180,alpha:0.18,v:2.2+Math.random()*1.4});}); (function mloop(){mouse.x+=(mouse.tx-mouse.x)*0.12;mouse.y+=(mouse.ty-mouse.y)*0.12; ctx.clearRect(0,0,innerWidth,innerHeight); ripples=ripples.filter(r=>{r.r+=r.v; r.alpha*=.985; if(r.r>r.rmax) return false; const g=ctx.createRadialGradient(r.x,r.y,0,r.x,r.y,r.r); g.addColorStop(0,`rgba(212,175,55,${r.alpha})`); g.addColorStop(0.35,`rgba(212,175,55,${r.alpha*0.4})`); g.addColorStop(1,'rgba(212,175,55,0)'); ctx.fillStyle=g; ctx.beginPath(); ctx.arc(r.x,r.y,r.r,0,Math.PI*2); ctx.fill(); return true;}); // persistent gold glow
const gg=ctx.createRadialGradient(mouse.x,mouse.y,0,mouse.x,mouse.y,320); gg.addColorStop(0,'rgba(212,175,55,.10)'); gg.addColorStop(1,'rgba(212,175,55,0)'); ctx.fillStyle=gg; ctx.beginPath(); ctx.arc(mouse.x,mouse.y,320,0,Math.PI*2); ctx.fill(); requestAnimationFrame(mloop);})();
const obs=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting) e.target.classList.add('in');});},{threshold:0.18}); document.querySelectorAll('.reveal').forEach(el=>obs.observe(el));
const heroBg=document.querySelector('.hero-bg img'); window.addEventListener('scroll',()=>{ if(!heroBg) return; const y=window.scrollY*0.12; heroBg.style.transform=`translate3d(0,${y}px,0) scale(1.06)`; },{passive:true});
const ham=document.querySelector('.hamburger'); const panel=document.querySelector('.mobile-panel'); ham?.addEventListener('click',()=>{panel.classList.toggle('open');});
document.querySelectorAll('a[href$=".html"]').forEach(a=>{a.addEventListener('click',e=>{const href=a.getAttribute('href'); if(!href.startsWith('http')){e.preventDefault(); document.body.style.opacity='0'; setTimeout(()=>{location.href=href;},320);}});});

</script>
