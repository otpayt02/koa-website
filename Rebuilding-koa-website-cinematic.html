<style>
:root{--midnight:#040818;--navy-900:#08142e;--navy-2:#22245F;--navy-film:#080d2d;--carmine:#c41e3a;--antique-gold:#c9a227;--antique-gold-soft:#e8c85a;--cream-base:#F4EDE1;--text-primary:#F5F0E8;--text-dark:#101743;--font-display:"Libre Caslon Display",Georgia,serif;--font-body:"DM Sans",system-ui,sans-serif;--font-karen:"Noto Serif Myanmar","Noto Sans Myanmar",sans-serif;--font-mono:"JetBrains Mono",monospace;--header-h:72px}
*{box-sizing:border-box}html{background:#040818}body{margin:0;font-family:var(--font-body);background:#040818;color:var(--text-primary);overscroll-behavior:none}
#glyph-field{position:fixed;inset:0;z-index:0;pointer-events:none}
.header{position:fixed;top:0;left:0;right:0;z-index:60;height:var(--header-h);display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:linear-gradient(to bottom, rgba(4,8,24,0.92), rgba(4,8,24,0.4));border-bottom:1px solid transparent;transition:all 0.5s ease}
.header.scrolled{background:rgba(8,13,45,0.96);backdrop-filter:blur(24px);border-color:rgba(201,162,39,0.12)}
.film-wrap{position:relative;height:900svh;z-index:1}.film-stage{position:sticky;top:0;height:100svh;overflow:hidden;background:radial-gradient(circle at 72% 36%, var(--navy-2) 0%, var(--navy-900) 38%, var(--navy-film) 100%)}
.film-progress{position:absolute;top:0;left:0;right:0;height:2px;background:rgba(255,255,255,0.06);z-index:5}.film-progress-bar{height:100%;transform-origin:left;transform:scaleX(0);background:linear-gradient(90deg,var(--carmine),var(--antique-gold))}
.scene{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0}.scene-bg{position:absolute;inset:0}.scene-bg img{width:100%;height:100%;object-fit:cover;transform:scale(1.18)}
.glass-panel{position:relative;z-index:2;max-width:720px;margin:0 24px;padding:36px;background:rgba(10,18,32,0.88);backdrop-filter:blur(18px);border:1px solid rgba(201,162,39,0.12);border-radius:3px}
.display{font-family:var(--font-display);font-size:clamp(2.8rem,6vw,5.2rem);line-height:0.9;margin:0 0 16px}.lead{font-size:clamp(1rem,1.5vw,1.15rem);line-height:1.6;opacity:0.85}
.animationContainer{position:relative;z-index:2}[data-beat]{will-change:transform,opacity}
.section{padding:120px 24px;position:relative;z-index:2}.section.cream{background:var(--cream-base);color:var(--text-dark)}.section.navy{background:var(--navy-film)}
</style>
