services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  ollama-models:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull embeddinggemma:300m && ollama pull qwen2.5:1.5b"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - ollama_data:/root/.ollama
    restart: "no"

  brain-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      BRAIN_DATA_PATH: /app/brain-data
      BRAIN_ADMIN_TOKEN: ${BRAIN_ADMIN_TOKEN:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      BRAIN_EMBEDDING_MODEL: ${BRAIN_EMBEDDING_MODEL:-embeddinggemma:300m}
      BRAIN_CHAT_MODEL: ${BRAIN_CHAT_MODEL:-qwen2.5:1.5b}
      GOOGLE_DRIVE_FOLDER_ID: ${GOOGLE_DRIVE_FOLDER_ID:-}
      GOOGLE_DRIVE_SCOPE: ${GOOGLE_DRIVE_SCOPE:-all_related}
      GOOGLE_DRIVE_ID: ${GOOGLE_DRIVE_ID:-}
      GOOGLE_TOKEN_PATH: /app/brain-data/brain-app/private/drive-token.json
      GOOGLE_CURSOR_PATH: /app/brain-data/brain-app/private/drive-cursor.txt
      SIGNAL_GROUP_ID: ${SIGNAL_GROUP_ID:-}
      SIGNAL_ACCOUNT: ${SIGNAL_ACCOUNT:-}
      SIGNAL_INGEST_APPROVED: ${SIGNAL_INGEST_APPROVED:-false}
    volumes:
      - ..:/app/brain-data
    depends_on:
      ollama-models:
        condition: service_completed_successfully

  brain-frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      BRAIN_API_TARGET: http://brain-backend:8000
    depends_on:
      brain-backend:
        condition: service_healthy
    working_dir: /app/brain-data/brain-app/frontend

  inbox-processor:
    build: ./inbox-processor
    environment:
      BRAIN_DATA_PATH: /app/brain-data
      INBOX_INTERVAL_MINUTES: ${INBOX_INTERVAL_MINUTES:-30}
    volumes:
      - ..:/app/brain-data
    working_dir: /app/brain-data/brain-app/inbox-processor

  news-aggregator:
    build: ./news-aggregator
    environment:
      BRAIN_DATA_PATH: /app/brain-data
    volumes:
      - ..:/app/brain-data
    working_dir: /app/brain-data/brain-app/news-aggregator

  signal-api:
    profiles: [signal]
    image: ${SIGNAL_API_IMAGE:-bbernhard/signal-cli-rest-api:latest}
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      MODE: json-rpc
      JSON_RPC_RECEIVE_MODE: manual
      JSON_RPC_IGNORE_ATTACHMENTS: "true"
    volumes:
      - signal_data:/home/.local/share/signal-cli

  signal-connector:
    profiles: [signal]
    build: ./connectors
    command: ["python", "signal_worker.py"]
    depends_on: [signal-api]
    environment:
      BRAIN_DATA_PATH: /app/brain-data
      PYTHONPATH: /app/brain-data/brain-app/backend
      SIGNAL_API_URL: http://signal-api:8080
      SIGNAL_ACCOUNT: ${SIGNAL_ACCOUNT:-}
      SIGNAL_GROUP_ID: ${SIGNAL_GROUP_ID:-}
      SIGNAL_INGEST_APPROVED: ${SIGNAL_INGEST_APPROVED:-false}
    volumes:
      - ..:/app/brain-data
    working_dir: /app/brain-data/brain-app/connectors

  drive-connector:
    profiles: [drive]
    build: ./connectors
    command: ["python", "drive_worker.py"]
    depends_on:
      ollama-models:
        condition: service_completed_successfully
    environment:
      BRAIN_DATA_PATH: /app/brain-data
      PYTHONPATH: /app/brain-data/brain-app/backend
      GOOGLE_DRIVE_FOLDER_ID: ${GOOGLE_DRIVE_FOLDER_ID:-}
      GOOGLE_DRIVE_SCOPE: ${GOOGLE_DRIVE_SCOPE:-all_related}
      GOOGLE_DRIVE_ID: ${GOOGLE_DRIVE_ID:-}
      GOOGLE_TOKEN_PATH: /app/brain-data/brain-app/private/drive-token.json
      GOOGLE_CURSOR_PATH: /app/brain-data/brain-app/private/drive-cursor.txt
      DRIVE_SYNC_INTERVAL_SECONDS: ${DRIVE_SYNC_INTERVAL_SECONDS:-60}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      BRAIN_EMBEDDING_MODEL: ${BRAIN_EMBEDDING_MODEL:-embeddinggemma:300m}
    volumes:
      - ..:/app/brain-data
    working_dir: /app/brain-data/brain-app/connectors

volumes:
  signal_data:
  ollama_data:
